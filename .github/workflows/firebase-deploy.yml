name: Deploy to Firebase Hosting

# Deploy หน้าเว็บไป Firebase Hosting อัตโนมัติทุกครั้งที่ push ขึ้น master
# (กดรันเองได้จากแท็บ Actions ผ่าน workflow_dispatch)
#
# หมายเหตุ: official action บางครั้งรายงาน fail ทั้งที่ deploy สำเร็จ (network ของ runner
# หลุดระหว่าง release → CLI retry แล้วเจอ "already active") เลยใช้ continue-on-error
# แล้วตัดสินผลจริงจาก version.txt ที่ขึ้น live (เทียบกับ commit SHA)
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ฝัง commit SHA ลงไฟล์ที่ถูก deploy เพื่อใช้ยืนยันว่าเวอร์ชันนี้ขึ้น live จริง
      - name: Stamp version
        run: echo "${{ github.sha }}" > version.txt

      - name: Deploy to Firebase Hosting (live)
        id: deploy
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: taruka-fbe28
          channelId: live

      # ตัดสินผลจากของจริง: version.txt บน live ต้องตรงกับ commit นี้
      - name: Verify deployment is live
        run: |
          expected="${{ github.sha }}"
          for i in $(seq 1 10); do
            got=$(curl -fsSL "https://taruka-fbe28.web.app/version.txt?ts=$(date +%s)" 2>/dev/null | tr -d '[:space:]')
            if [ "$got" = "$expected" ]; then
              echo "✅ deploy สำเร็จ — version.txt บน live = $got"
              exit 0
            fi
            echo "ครั้งที่ $i: live=$got (รอ=$expected) — รอ propagate แล้วลองใหม่..."
            sleep 6
          done
          echo "❌ เวอร์ชันนี้ยังไม่ขึ้น live — deploy ล้มเหลวจริง"
          exit 1
